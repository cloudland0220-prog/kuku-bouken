<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#6c5ce7">
<title>九九ぼうけん！</title>
<style>
:root{--purple:#6c5ce7;--ink:#29254a;--gold:#ffd166;--mint:#d9fff1;--pink:#ffe0eb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(160deg,#e8e4ff,#f8f6ff 48%,#fff1f5);color:var(--ink);min-height:100vh}
main{max-width:560px;margin:auto;padding:16px 15px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:23px;font-weight:900;letter-spacing:.02em}
.pill{background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;box-shadow:0 3px 0 #ded9ff}
.hero{margin:14px 0 16px;padding:19px;border-radius:25px;background:linear-gradient(135deg,#7b6cf6,#a18cff);color:white;box-shadow:0 7px 0 #5949c6;position:relative;overflow:hidden}
.hero:after{content:"✦";position:absolute;font-size:90px;right:12px;top:-20px;color:#ffffff30}
.hero h1{font-size:27px;line-height:1.25;margin:0 0 8px}
.hero p{margin:0;line-height:1.55;font-size:14px;max-width:85%}
.card{background:#fff;border:2px solid #eeeaff;border-radius:22px;padding:17px;margin:13px 0;box-shadow:0 4px 0 #e5e0ff}
h2{font-size:18px;margin:0 0 12px}
.small{font-size:13px;color:#77738e}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stage{border:0;border-radius:17px;padding:13px 4px;background:#f0edff;color:var(--ink);font:inherit;font-weight:850;box-shadow:0 3px 0 #d8d0ff;min-height:75px}
.stage span{display:block;font-size:25px;margin-bottom:3px}
.stage.done{background:#fff1c9;box-shadow:0 3px 0 #f4cf69}
.stage.current{outline:3px solid var(--purple)}
.stage:disabled{opacity:.45}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.primary{border:0;background:var(--purple);color:white;border-radius:16px;padding:14px 18px;font:inherit;font-weight:900;font-size:17px;box-shadow:0 4px 0 #4d3db8;width:100%}
.secondary{border:2px solid #ded8ff;background:white;color:var(--purple);border-radius:14px;padding:11px 14px;font:inherit;font-weight:800}
.question-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.progress{height:9px;border-radius:99px;background:#eeeaff;overflow:hidden;margin:10px 0 18px}
.progress div{height:100%;width:0;background:#55d6a2;transition:width .2s}
.mascot{text-align:center;font-size:58px;margin:0}
.question{text-align:center;font-size:39px;font-weight:950;margin:7px 0 16px;letter-spacing:.02em}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.answer{background:#f5f2ff;border:2px solid #e3ddff;border-radius:17px;min-height:64px;font-size:25px;font-weight:900;color:var(--ink);box-shadow:0 3px 0 #ded7ff}
.answer:active,.stage:active{transform:translateY(2px);box-shadow:none}
.feedback{min-height:48px;text-align:center;font-size:16px;font-weight:850;line-height:1.5;padding:12px 4px 0}
.feedback.good{color:#15966b}.feedback.try{color:#d06b21}
.row{display:flex;gap:9px;margin-top:10px}.row>*{flex:1}
.hidden{display:none!important}
.result{text-align:center}
.bigstar{font-size:54px;margin:3px}
.result h2{font-size:25px}
table{width:100%;border-collapse:collapse;text-align:center;font-weight:750}
td,th{padding:8px 3px;border-bottom:1px solid #eeeaff}
footer{text-align:center;color:#88839f;font-size:12px;padding:14px}
</style>
</head>
<body>
<main>
<header><div class="logo">🌟 九九ぼうけん！</div><div class="pill">⭐ <span id="totalStars">0</span></div></header>
<section class="hero">
<h1>九九の勇者になろう！</h1>
<p>1つずつ覚えて、星を集めよう。まちがえても大丈夫。ヒントを使って考えよう！</p>
</section>

<section id="home">
<div class="card">
<h2>🗺️ ぼうけんマップ</h2>
<p class="small">好きな段から練習できるよ。はじめてなら「1の段」から！</p>
<div class="stages" id="stages"></div>
</div>
<div class="card">
<h2>🏆 きみの記録</h2>
<div id="record">まだ冒険を始めていないよ！</div>
</div>
</section>

<section id="play" class="hidden">
<div class="card">
<div class="question-top"><span id="stageLabel">1の段</span><span id="countLabel">1 / 9 問</span></div>
<div class="progress"><div id="bar"></div></div>
<div class="mascot" id="mascot">🦊</div>
<div class="question" id="question">1 × 1 ＝ ?</div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="row"><button class="secondary" id="hintBtn">💡 ヒント</button><button class="secondary" id="skipBtn">あとでもう一度</button></div>
</div>
<button class="secondary" id="homeBtn" style="width:100%">マップにもどる</button>
</section>

<section id="result" class="hidden">
<div class="card result">
<div class="bigstar" id="resultIcon">🌟</div>
<h2 id="resultTitle">ステージクリア！</h2>
<p id="resultText"></p>
<div id="earned" style="font-size:22px;font-weight:900;color:#9a7200;margin:14px"></div>
<button class="primary" id="againBtn">もう一度チャレンジ</button>
<div class="row"><button class="secondary" id="nextBtn">次の段へ ➜</button><button class="secondary" id="resultHomeBtn">マップへ</button></div>
</div>
</section>
<footer>あせらず、1日5分でも大丈夫。🌱</footer>
</main>
<script>
const $=id=>document.getElementById(id);
let currentTable=1, questions=[], qi=0, stars=Number(localStorage.getItem('kukuStars')||0);
let correct=0, mistakes=[], hintUsed=false, answered=false;
let cleared=JSON.parse(localStorage.getItem('kukuCleared')||'[]');
let best=JSON.parse(localStorage.getItem('kukuBest')||'{}');
const mascots=['🦊','🐼','🐸','🐰','🐯','🐧','🐻','🦄','🐲'];
function save(){localStorage.setItem('kukuStars',stars);localStorage.setItem('kukuCleared',JSON.stringify(cleared));localStorage.setItem('kukuBest',JSON.stringify(best));}
function updateHeader(){$('totalStars').textContent=stars;}
function drawStages(){
 $('stages').innerHTML='';
 for(let n=1;n<=9;n++){
  const b=document.createElement('button');b.className='stage'+(cleared.includes(n)?' done':'')+(n===currentTable?' current':'');
  b.innerHTML=`<span>${cleared.includes(n)?'🏅':mascots[n-1]}</span>${n}の段${cleared.includes(n)?'<br><small>クリア！</small>':''}`;
  b.onclick=()=>startStage(n);$('stages').appendChild(b);
 }
 const nDone=cleared.length;
 $('record').innerHTML=`クリアした段：<strong>${nDone} / 9</strong><br>集めた星：<strong>${stars} 個</strong>`+(nDone===9?'<p>🎉 すごい！九九マスターだ！</p>':'');
 updateHeader();
}
function startStage(n){
 currentTable=n;questions=Array.from({length:9},(_,i)=>i+1).sort(()=>Math.random()-.5);
 qi=0;correct=0;mistakes=[];hintUsed=false;answered=false;
 $('home').classList.add('hidden');$('result').classList.add('hidden');$('play').classList.remove('hidden');
 showQuestion();
}
function showQuestion(){
 if(qi>=questions.length){finish();return}
 hintUsed=false;answered=false;
 const factor=questions[qi];
 $('stageLabel').textContent=currentTable+'の段';
 $('countLabel').textContent=(qi+1)+' / 9 問';
 $('bar').style.width=(qi/9*100)+'%';
 $('mascot').textContent=mascots[currentTable-1];
 $('question').textContent=`${currentTable} × ${factor} ＝ ?`;
 $('feedback').textContent='答えをえらんでね！';$('feedback').className='feedback';
 const answer=currentTable*factor, opts=new Set([answer]);
 while(opts.size<4){let v=answer+Math.floor(Math.random()*11)-5;if(v>0&&v<=81)opts.add(v)}
 let arr=[...opts].sort(()=>Math.random()-.5);
 // Ensure options include answer and keep choices varied.
 $('answers').innerHTML='';
 arr.forEach(v=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>choose(v,b);$('answers').appendChild(b)});
}
function choose(v,btn){
 if(answered)return;
 const ans=currentTable*questions[qi];
 if(v===ans){
  answered=true;correct++;stars++;save();updateHeader();
  $('feedback').textContent=hintUsed?'正解！ヒントを使って考えられたね！':'せいかい！すごい！ ⭐';
  $('feedback').className='feedback good';
  [...$('answers').children].forEach(b=>b.disabled=true);
  btn.style.background='#d9fff1';btn.style.borderColor='#55d6a2';
  $('bar').style.width=((qi+1)/9*100)+'%';
  $('skipBtn').textContent=qi===8?'結果を見る':'次の問題 ➜';
  $('skipBtn').onclick=()=>{qi++;showQuestion()};
 }else{
  mistakes.push(questions[qi]);
  $('feedback').textContent='おしい！ もう一度考えてみよう。ヒントも使えるよ。';
  $('feedback').className='feedback try';
  btn.style.background='#ffe0eb';btn.style.borderColor='#ff9fbd';btn.disabled=true;
 }
}
function hint(){
 const f=questions[qi],a=currentTable*f;
 hintUsed=true;
 const msg=`${currentTable}を${f}回たすと考えよう。 ${currentTable} × ${Math.max(1,f-1)} の答えに、${currentTable}を1つ足すと？`;
 $('feedback').textContent=msg;$('feedback').className='feedback';
}
function skip(){
 if(answered){qi++;showQuestion();return}
 if(!mistakes.includes(questions[qi]))mistakes.push(questions[qi]);
 $('feedback').textContent='この問題はあとで復習しよう！';$('feedback').className='feedback try';
 setTimeout(()=>{qi++;showQuestion()},500);
}
function finish(){
 $('play').classList.add('hidden');$('result').classList.remove('hidden');
 const perfect=correct===9;
 if(!cleared.includes(currentTable)){cleared.push(currentTable)}
 best[currentTable]=Math.max(best[currentTable]||0,correct);save();drawStages();
 $('resultIcon').textContent=perfect?'🏆':'🌟';
 $('resultTitle').textContent=perfect?'ステージクリア！':'よくがんばったね！';
 $('resultText').textContent=`${currentTable}の段：9問中 ${correct}問正解！`+(perfect?' パーフェクト！':' 間違えた問題は、もう一度やってみよう。');
 $('earned').textContent=`⭐ ${correct} 個の星をゲット！`;
 $('nextBtn').style.display=currentTable<9?'':'none';
 $('againBtn').onclick=()=>startStage(currentTable);
 $('nextBtn').onclick=()=>startStage(currentTable<9?currentTable+1:1);
 $('resultHomeBtn').onclick=home;
}
function home(){
 $('play').classList.add('hidden');$('result').classList.add('hidden');$('home').classList.remove('hidden');
 $('skipBtn').textContent='あとでもう一度';$('skipBtn').onclick=skip;
 drawStages();
}
$('hintBtn').onclick=hint;$('skipBtn').onclick=skip;$('homeBtn').onclick=home;
drawStages();
</script>
</body></html>
